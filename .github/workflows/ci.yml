name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required files and Markdown links
        run: python scripts/validate-foundation.py .

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
      # Installed before the cache step: the cache key includes the rustc
      # version. The key also includes the Cargo.lock hash, so a dependency
      # change always builds cold.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Run verification
        run: npm run verify

  e2e:
    # Drives the renderer in a real browser to check the route, title,
    # keyboard and reflow contracts. Kept out of `npm run verify` so local
    # verification does not need a browser download.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install Playwright Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end presentation tests
        run: npm run test:e2e
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  windows-build:
    # Release tags and manual runs only: the Linux jobs already compile the
    # whole workspace on every push.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Validate locked Rust dependency graph
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Build the Windows desktop application
        run: npm run desktop:build