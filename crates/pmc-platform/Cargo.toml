[package]
name = "pmc-platform"
version = "0.2.0-beta"
edition = "2021"
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[dependencies]
age = { version = "=0.12.1", default-features = false }
atomic-write-file = "=0.3.1"
getrandom = "=0.2.17"
icu_locale_core = { version = "=2.3.0", features = ["alloc"] }
jiff = "=0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
# The one approved `unsafe` call (windows_names.rs): Windows' own name
# comparison. Already in the tree; only this feature is added.
windows-sys = { version = "=0.61.2", features = ["Win32_Globalization"] }
keyring-core = "=1.0.0"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
zeroize = "=1.9.0"
