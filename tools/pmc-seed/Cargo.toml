[package]
name = "pmc-seed"
description = "Developer-only synthetic seed for the Training workspace (never Live)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pmc-seed"
path = "src/main.rs"

[dependencies]
pmc-application = { path = "../../crates/pmc-application" }
pmc-domain = { path = "../../crates/pmc-domain" }
pmc-knowledge = { path = "../../crates/pmc-knowledge" }
pmc-ledger = { path = "../../crates/pmc-ledger" }
pmc-platform = { path = "../../crates/pmc-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"

[lints]
workspace = true
