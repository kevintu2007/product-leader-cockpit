[package]
name = "pmc-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pmc_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
pmc-application = { path = "../../../crates/pmc-application" }
pmc-domain = { path = "../../../crates/pmc-domain" }
pmc-ledger = { path = "../../../crates/pmc-ledger" }
pmc-platform = { path = "../../../crates/pmc-platform" }
serde = { version = "1.0.229", features = ["derive"] }

# Host-owned native dialogs (ADR 0011). Windows only; no portal or GTK code.
[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[lints]
workspace = true
